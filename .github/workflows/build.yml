name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        id: p
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then unzip -o -q "$z" -d unpacked; fi
          done
          F=$(find . \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "Проєкт не знайдено. Файли в репозиторії:"
            find . -not -path './.git/*'
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ steps.p.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: McServer-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
